events {}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  upstream erp_backend { server erpnext:8000; }

  server {
    listen 8080;
    server_name _;

    # Static assets and files — served directly from shared volume
    location /assets/ {
      alias /sites/assets/;
      expires 1y;
      add_header Cache-Control "public";
      types {
        text/css                       css;
        application/javascript         js;
        application/json               json;
        image/svg+xml                  svg;
        font/woff2                     woff2;
        font/woff                      woff;
      }
    }
    location /files/ {
      alias /sites/site.local/public/files/;
      expires 1h;
      add_header Cache-Control "public";
    }

    # App requests proxied to gunicorn
    location / {
      # pass through the actual Host header for correct cookie binding
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout   300s;
      proxy_connect_timeout 60s;
      proxy_pass http://erp_backend;
    }
  }
}

