name: build-and-push
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: vars
        run: |
          echo "TAG=v0.1.0+${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build & push landing (production)
        uses: docker/build-push-action@v6
        with:
          context: ./landing
          target: production
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.OWNER }}/truststack-landing:${{ steps.vars.outputs.TAG }}

      - name: Build & push fir (production)
        uses: docker/build-push-action@v6
        with:
          context: ./fir
          target: production
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.OWNER }}/truststack-fir:${{ steps.vars.outputs.TAG }}

      - name: Build & push simulator (production)
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          target: production
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.OWNER }}/truststack-simulator:${{ steps.vars.outputs.TAG }}

      - name: Build & push anomaly (production)
        uses: docker/build-push-action@v6
        with:
          context: ./anomaly
          target: production
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.OWNER }}/truststack-anomaly:${{ steps.vars.outputs.TAG }}

      - name: Build & push erp-adapter (production)
        uses: docker/build-push-action@v6
        with:
          context: ./erp-adapter
          target: production
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.OWNER }}/truststack-erp-adapter:${{ steps.vars.outputs.TAG }}


