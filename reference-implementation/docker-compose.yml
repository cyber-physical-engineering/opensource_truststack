services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_postgres
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  openobserve:
    image: openobserve/openobserve:latest
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${OO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OO_ROOT_USER_PASSWORD}
      ZO_DATA_DIR: /data
      RUST_LOG: ${OO_RUST_LOG:-warn}
      ZO_TELEMETRY: ${OO_TELEMETRY:-false}
    ports:
      - "${OO_PORT:-3031}:5080"
    volumes:
      - oo_data:/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3033}
    ports:
      - "${GRAFANA_PORT:-3033}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  fir:
    build:
      context: ./fir
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_fir
    environment:
      FIR_PORT: 3006
      PGHOST: postgres
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: 5432
      FIR_ADMIN_EMAIL: ${FIR_ADMIN_EMAIL}
      FIR_ADMIN_PASSWORD: ${FIR_ADMIN_PASSWORD}
      FIR_SERVICE_TOKEN: ${FIR_SERVICE_TOKEN}
      ANOMALY_INTERNAL_URL: http://anomaly:3011
      ANOMALY_PUBLIC_URL: http://localhost:${ANOMALY_HOST_PORT:-3035}
      ANOMALY_ADMIN_TOKEN: ${ANOMALY_ADMIN_TOKEN}
    ports:
      - "${FIR_HOST_PORT:-3032}:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3006/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  landing:
    build:
      context: ./landing
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_landing
    environment:
      LANDING_PORT: 3005
      PGHOST: postgres
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: 5432
      OO_PUBLIC_URL: ${OO_URL:-http://localhost:3031}
      GRAFANA_PUBLIC_URL: ${GRAFANA_URL:-http://localhost:3033}
      FIR_PUBLIC_URL: ${FIR_URL:-http://localhost:3032}
      # Internal URLs for health pings from inside the Docker network
      OO_INTERNAL_URL: http://openobserve:5080
      FIR_INTERNAL_URL: http://fir:3006
      GRAFANA_INTERNAL_URL: http://grafana:3000
      FAQ_INTERNAL_PORT: 3007
      FAQ_HOST_PORT: ${FAQ_HOST_PORT:-3034}
      # ERP / MES-lite settings
      ERP_URL: ${ERP_URL:-}
      ERP_MES_HOST_PORT: ${ERP_MES_HOST_PORT:-3036}
      ERP_DEMO_ENABLED: ${ERP_DEMO_ENABLED:-1}
      ERP_ADAPTER_INTERNAL_URL: http://erp-adapter:3034
      ERP_ADAPTER_PUBLIC_URL: ${ERP_ADAPTER_URL:-http://localhost:${ERP_ADAPTER_HOST_PORT:-3040}}
      # MES profile detection for Landing badge (and ping fallback)
      MES_PROFILE: ${MES_PROFILE:-0}
      ERP_INTERNAL_URL: ${ERP_INTERNAL_URL:-http://erp_nginx:8080}
      ERP_SITE_NAME: ${ERP_SITE_NAME:-localhost}
      # ERP bridge (internal ping + public open link)
      ERP_BRIDGE_INTERNAL_URL: http://erp-bridge:3037
      ERP_BRIDGE_PUBLIC_URL: ${ERP_BRIDGE_URL:-http://localhost:${ERP_BRIDGE_HOST_PORT:-3041}}
    ports:
      - "${LANDING_HOST_PORT:-3030}:3005"
      - "127.0.0.1:${FAQ_HOST_PORT:-3034}:3007"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3005/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  erp-bridge:
    build:
      context: ./erp-bridge
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_erp_bridge
    profiles: ["mes"]
    environment:
      ERP_BRIDGE_PORT: 3037
      ERP_BRIDGE_POLL_MS: ${ERP_BRIDGE_POLL_MS:-15000}
      # ERP API (from h.3)
      ERP_API_URL: ${ERP_API_URL:-}
      ERP_API_HOST_HEADER: ${ERP_API_HOST_HEADER:-site.local}
      ERP_API_KEY: ${ERP_API_KEY:-}
      ERP_API_SECRET: ${ERP_API_SECRET:-}
      # OpenObserve
      OO_URL: ${OO_INTERNAL_URL:-http://openobserve:5080}
      OO_USER: ${OO_USER:-${OO_ROOT_USER_EMAIL}}
      OO_PASS: ${OO_PASS:-${OO_ROOT_USER_PASSWORD}}
      # FIR
      FIR_INTERNAL_URL: http://fir:3006
      FIR_SERVICE_TOKEN: ${FIR_SERVICE_TOKEN}
    ports:
      - "${ERP_BRIDGE_HOST_PORT:-3041}:3037"
    depends_on:
      openobserve:
        condition: service_started
      fir:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3037/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${ERP_BRIDGE_MEM_LIMIT:-256m}
    restart: unless-stopped

  erp-adapter:
    build:
      context: ./erp-adapter
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_erp_adapter
    environment:
      ERP_ADAPTER_PORT: 3034
      ERP_URL: ${ERP_URL:-}
      ERP_DEMO_ENABLED: ${ERP_DEMO_ENABLED:-1}
      OO_URL: ${OO_INTERNAL_URL:-http://openobserve:5080}
      OO_USER: ${OO_USER:-${OO_ROOT_USER_EMAIL}}
      OO_PASS: ${OO_PASS:-${OO_ROOT_USER_PASSWORD}}
    ports:
      - "${ERP_ADAPTER_HOST_PORT:-3040}:3034"
    depends_on:
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3034/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${ERP_ADAPTER_MEM_LIMIT:-128m}
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_simulator
    environment:
      SIM_PORT: 3010
      SIM_PERIOD_MS: ${SIM_PERIOD_MS:-1000}
      SIM_SERIES: ${SIM_SERIES:-baseline}
      SIM_AUTO_START: ${SIM_AUTO_START:-0}
      ENABLE_OO: ${ENABLE_OO:-1}
      SEED_HISTORY: ${SEED_HISTORY:-1}
      OO_INGEST_URL: ${OO_INGEST_URL:-http://openobserve:5080/api/default/simulator/_json}
      OO_STREAM: ${OO_STREAM:-simulator}
      OO_USER: ${OO_USER:-${OO_ROOT_USER_EMAIL}}
      OO_PASS: ${OO_PASS:-${OO_ROOT_USER_PASSWORD}}
      # Postgres for sim_state persistence
      PGHOST: postgres
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: 5432
    depends_on:
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3010/healthz >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s
    restart: unless-stopped

  anomaly:
    build:
      context: ./anomaly
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_anomaly
    environment:
      ANOMALY_PORT: 3011
      SIMULATOR_INTERNAL_URL: http://simulator:3010
      Z_THRESHOLD: ${Z_THRESHOLD:-1.5}
      EMA_ALPHA: ${EMA_ALPHA:-0.2}
      ENABLE_OO: ${ENABLE_OO:-1}
      OO_INGEST_URL: ${OO_ANOMALY_INGEST_URL:-http://openobserve:5080/api/default/anomaly/_json}
      OO_USER: ${OO_USER:-${OO_ROOT_USER_EMAIL}}
      OO_PASS: ${OO_PASS:-${OO_ROOT_USER_PASSWORD}}
      FIR_INTERNAL_URL: http://fir:3006
      FIR_SERVICE_TOKEN: ${FIR_SERVICE_TOKEN}
      ANOMALY_ADMIN_TOKEN: ${ANOMALY_ADMIN_TOKEN}
    ports:
      - "${ANOMALY_HOST_PORT:-3035}:3011"
    depends_on:
      openobserve:
        condition: service_started
      simulator:
        condition: service_started
      fir:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3011/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped

  # --- MES profile: ERPNext demo stack (isolated) ---
  erp_mariadb:
    image: mariadb:10.6.18
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_erp_mariadb
    profiles: ["mes"]
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ERP_DB_NAME:-frappe}
      MYSQL_USER: ${ERP_DB_USER:-frappe}
      MYSQL_PASSWORD: ${ERP_DB_PASSWORD}
    volumes:
      - erp_db_data:/var/lib/mysql
      - ./mariadb-config:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 6s
      timeout: 5s
      retries: 10
    mem_limit: ${ERP_MARIADB_MEM:-512m}
    restart: unless-stopped

  erp_redis:
    image: redis:7.2.5-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_erp_redis
    profiles: ["mes"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 6s
      timeout: 5s
      retries: 10
    mem_limit: ${ERP_REDIS_MEM:-128m}
    restart: unless-stopped

  erpnext:
    image: ${ERP_IMAGE_REPO:-frappe/erpnext}:${ERP_IMAGE_TAG:-v15.17.0}
    platform: ${ERP_PLATFORM:-linux/amd64}
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_erpnext
    profiles: ["mes"]
    environment:
      # These variables may be used by helper scripts during site init
      ERPNEXT_SITE_NAME: ${ERP_SITE_NAME:-site.local}
      ERPNEXT_ADMIN_EMAIL: ${ERP_BOOTSTRAP_ADMIN_EMAIL}
      ERPNEXT_ADMIN_PASSWORD: ${ERP_BOOTSTRAP_ADMIN_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD}
      DB_HOST: erp_mariadb
      REDIS_CACHE: redis://erp_redis:6379
      REDIS_QUEUE: redis://erp_redis:6379
      REDIS_SOCKETIO: redis://erp_redis:6379
    volumes:
      - erp_sites_data:/home/frappe/frappe-bench/sites
      - erp_logs_data:/home/frappe/frappe-bench/logs
    depends_on:
      erp_mariadb:
        condition: service_healthy
      erp_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Accept: application/json' http://localhost:8000/api/method/ping | grep -q pong"]
      interval: 6s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  erp_nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-truststack}_erp_nginx
    profiles: ["mes"]
    depends_on:
      erpnext:
        condition: service_started
    volumes:
      - ./nginx/erpnext.conf:/etc/nginx/nginx.conf:ro
      - erp_sites_data:/sites:ro
      - erp_sites_assets:/sites/assets:ro
      - erp_logs_data:/var/log/nginx
    ports:
      - "${ERP_MES_HOST_PORT:-3036}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/method/ping | grep -q pong"]
      interval: 6s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  oo_data:
  grafana_data:
  prom_data:

  # MES profile volumes (isolated to profile)
  erp_db_data:
  erp_sites_data:
  erp_logs_data:
  erp_sites_assets:


